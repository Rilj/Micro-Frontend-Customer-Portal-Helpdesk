<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <style>
    .shell { fill: #1e40af; }
    .remote { fill: #3730a3; }
    .backend { fill: #7c3aed; }
    .label { font-family: system-ui; font-size: 14px; fill: #fff; }
    .edge { stroke: #e5e7eb; stroke-width: 2; }
  </style>

  <rect x="250" y="50" width="300" height="80" rx="8" class="shell"/>
  <text x="400" y="90" text-anchor="middle" class="label font-bold">Shell / Host App</text>
  <text x="400" y="110" text-anchor="middle" class="label" font-size="12">Routing, Auth State, Layout</text>

  <rect x="50" y="200" width="200" height="100" rx="8" class="remote"/>
  <text x="150" y="240" text-anchor="middle" class="label">Remote Auth</text>
  <text x="150" y="260" text-anchor="middle" class="label" font-size="12">Login &amp; Profile (3003)</text>

  <rect x="300" y="200" width="200" height="100" rx="8" class="remote"/>
  <text x="400" y="240" text-anchor="middle" class="label">Remote Ticketing</text>
  <text x="400" y="260" text-anchor="middle" class="label" font-size="12">Tickets &amp; Threads (3001)</text>

  <rect x="550" y="200" width="200" height="100" rx="8" class="remote"/>
  <text x="650" y="240" text-anchor="middle" class="label">Remote Chat</text>
  <text x="650" y="260" text-anchor="middle" class="label" font-size="12">WebSocket Chat (3002)</text>

  <rect x="300" y="350" width="200" height="100" rx="8" class="remote"/>
  <text x="400" y="390" text-anchor="middle" class="label">Remote KB</text>
  <text x="400" y="410" text-anchor="middle" class="label" font-size="12">Knowledge Base (3004)</text>

  <rect x="50" y="500" width="160" height="70" rx="8" class="backend"/>
  <text x="130" y="530" text-anchor="middle" class="label">Auth Service</text>
  <text x="130" y="550" text-anchor="middle" class="label" font-size="10">NestJS (8000)</text>

  <rect x="230" y="500" width="160" height="70" rx="8" class="backend"/>
  <text x="310" y="530" text-anchor="middle" class="label">Ticket Service</text>
  <text x="310" y="550" text-anchor="middle" class="label" font-size="10">Go/Gin (8001)</text>

  <rect x="410" y="500" width="160" height="70" rx="8" class="backend"/>
  <text x="490" y="530" text-anchor="middle" class="label">Chat Service</text>
  <text x="490" y="550" text-anchor="middle" class="label" font-size="10">Socket.io (8002)</text>

  <rect x="590" y="500" width="160" height="70" rx="8" class="backend"/>
  <text x="670" y="530" text-anchor="middle" class="label">KB Service</text>
  <text x="670" y="550" text-anchor="middle" class="label" font-size="10">Express (8003)</text>

  <line x1="400" y1="130" x2="150" y2="200" class="edge"/>
  <line x1="400" y1="130" x2="400" y2="200" class="edge"/>
  <line x1="400" y1="130" x2="650" y2="200" class="edge"/>
  <line x1="400" y1="130" x2="400" y2="350" class="edge"/>

  <line x1="150" y1="300" x2="130" y2="500" class="edge"/>
  <line x1="400" y1="300" x2="310" y2="500" class="edge"/>
  <line x1="650" y1="300" x2="670" y2="500" class="edge"/>
  <line x1="400" y1="450" x2="490" y2="500" class="edge"/>
</svg>
